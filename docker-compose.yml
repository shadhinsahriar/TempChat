version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tempchat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tempchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tempchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempchat_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/tempchat
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=/app/storage/media
      - SECRET_KEY=development-secret-key-change-in-prod
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - tempchat_media:/app/storage/media

volumes:
  postgres_data:
  tempchat_media:
